[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "returnbounds"
version = "1.0.0"
description = "Finite-horizon MGF and moment-based confidence intervals for POMDP returns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
returnbounds-reproduce = "reproduce:main"

[tool.setuptools]
py-modules = ["reproduce"]

[tool.setuptools.packages.find]
include = ["returnbounds*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
